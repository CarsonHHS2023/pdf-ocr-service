name: PR31 Apply Uninspectable Event Fix

on:
  push:
    branches:
      - s0/phase2-collector-mapping
    paths:
      - '.github/workflows/pr31-apply-uninspectable-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: s0/phase2-collector-mapping
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -q pytest sqlalchemy alembic

      - name: Apply exact reviewed fix
        shell: bash
        run: |
          cat > /tmp/pr31-fix.patch <<'PATCH'
          --- a/app/processing/s0_baseline.py
          +++ b/app/processing/s0_baseline.py
          @@ -374,9 +374,20 @@
               event_name: str,
               field: str,
               evidence_incomplete: bool,
          +    uninspectable_event_names: frozenset[str] = frozenset(),
               require_process_wide: bool = False,
           ) -> _EventMeasurement:
               """Extract one unambiguous successful numeric measurement by exact event contract."""
          +    if event_name in uninspectable_event_names:
          +        return _EventMeasurement(
          +            value=None,
          +            status="not_available",
          +            note=(
          +                f"At least one retained {event_name} payload could not be inspected; "
          +                "the collector cannot rule out an ambiguous duplicate successful measurement."
          +            ),
          +        )
          +
               matching = [event for event in decoded_events if event.event_name == event_name]
               if not matching:
                   return _EventMeasurement(
          @@ -710,18 +721,22 @@
               )
           
               decoded_events: list[_DecodedEvent] = []
          +    uninspectable_event_names: set[str] = set()
               event_payload_decode_incomplete = False
               event_payload_oversized_incomplete = False
               for row in rows:
                   if row.payload_oversized:
                       event_payload_oversized_incomplete = True
          +            uninspectable_event_names.add(row.event_name)
                       continue
                   payload, decode_valid = _decode_event_payload(row.payload_json)
                   if not decode_valid:
                       event_payload_decode_incomplete = True
          +            uninspectable_event_names.add(row.event_name)
                       continue
                   decoded_events.append(_DecodedEvent(event_name=row.event_name, payload=payload))
               decoded_events_tuple = tuple(decoded_events)
          +    uninspectable_event_names_frozen = frozenset(uninspectable_event_names)
               decoded_payloads_tuple = tuple(event.payload for event in decoded_events_tuple)
               payload_evidence_incomplete = (
                   event_window_truncated
          @@ -780,12 +795,14 @@
                   event_name="PDF_S0_PREPROCESSING_MEASURED",
                   field="elapsed_seconds",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
               )
               canonicalization_measurement = _event_measurement(
                   decoded_events_tuple,
                   event_name="PDF_S0_CANONICALIZATION_MEASURED",
                   field="elapsed_seconds",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
               )
           
               required_by_key: dict[str, MetricReading] = {
          @@ -972,6 +989,7 @@
                   event_name="PDF_S0_PREPROCESSING_MEASURED",
                   field="process_cpu_delta_seconds",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
                   require_process_wide=True,
               )
               preprocessing_rss = _event_measurement(
          @@ -979,6 +997,7 @@
                   event_name="PDF_S0_PREPROCESSING_MEASURED",
                   field="process_rss_endpoint_mb",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
                   require_process_wide=True,
               )
               process_lifetime_peak = _phase2_process_lifetime_peak(
          @@ -990,18 +1009,21 @@
                   event_name="PDF_S0_PROVIDER_INTEGRATION_MEASURED",
                   field="elapsed_seconds",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
               )
               provider_input_size = _event_measurement(
                   decoded_events_tuple,
                   event_name="PDF_S0_PREPROCESSING_MEASURED",
                   field="provider_input_size_bytes",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
               )
               raw_result_size = _event_measurement(
                   decoded_events_tuple,
                   event_name="PDF_S0_CANONICALIZATION_MEASURED",
                   field="raw_result_size_bytes",
                   evidence_incomplete=payload_evidence_incomplete,
          +        uninspectable_event_names=uninspectable_event_names_frozen,
               )
           
               auxiliary: list[MetricReading] = [
          --- a/tests/test_s0_phase2_baseline_mapping.py
          +++ b/tests/test_s0_phase2_baseline_mapping.py
          @@ -7,6 +7,7 @@
           
           from app.models import Base, Document, ProcessingRun, SourceFile, encode_json_text
           from app.processing.processing_event_model import ProcessingEvent
          +from app.processing.processing_events import MAX_EVENT_PAYLOAD_BYTES
           from app.processing.s0_baseline import collect_s0_run_snapshot
           
           
          @@ -348,3 +349,57 @@
               assert _metric(snapshot, "preprocessing_wall_seconds").value is None
               assert _metric(snapshot, "canonicalization_duration_seconds").status == "not_available"
               assert _metric(snapshot, "canonicalization_duration_seconds").value is None
          +
          +
          +def test_malformed_same_name_event_blocks_definitive_preprocessing_measurement() -> None:
          +    db = _session()
          +    run_id = _seed_phase2_run(db)
          +    started = datetime(2026, 8, 24, 22, 47, 28)
          +    db.add(
          +        ProcessingEvent(
          +            id="phase2-preprocessing-malformed",
          +            processing_run_id=run_id,
          +            document_id="doc-phase2-map",
          +            schema_version="atlas.processing.event.v1",
          +            event_name="PDF_S0_PREPROCESSING_MEASURED",
          +            severity="info",
          +            payload_json="{malformed-json",
          +            created_at=started + timedelta(seconds=46),
          +        )
          +    )
          +    db.commit()
          +
          +    snapshot = collect_s0_run_snapshot(db, processing_run_id=run_id)
          +
          +    assert snapshot.event_payload_decode_incomplete is True
          +    preprocessing_wall = _metric(snapshot, "preprocessing_wall_seconds")
          +    assert preprocessing_wall.status == "not_available"
          +    assert preprocessing_wall.value is None
          +    assert "could not be inspected" in (preprocessing_wall.note or "").lower()
          +
          +
          +def test_oversized_same_name_event_blocks_definitive_canonicalization_measurement() -> None:
          +    db = _session()
          +    run_id = _seed_phase2_run(db)
          +    started = datetime(2026, 8, 24, 22, 47, 28)
          +    db.add(
          +        ProcessingEvent(
          +            id="phase2-canonicalization-oversized",
          +            processing_run_id=run_id,
          +            document_id="doc-phase2-map",
          +            schema_version="atlas.processing.event.v1",
          +            event_name="PDF_S0_CANONICALIZATION_MEASURED",
          +            severity="info",
          +            payload_json="x" * (MAX_EVENT_PAYLOAD_BYTES + 1),
          +            created_at=started + timedelta(seconds=152, microseconds=1),
          +        )
          +    )
          +    db.commit()
          +
          +    snapshot = collect_s0_run_snapshot(db, processing_run_id=run_id)
          +
          +    assert snapshot.event_payload_oversized_incomplete is True
          +    canonicalization = _metric(snapshot, "canonicalization_duration_seconds")
          +    assert canonicalization.status == "not_available"
          +    assert canonicalization.value is None
          +    assert "could not be inspected" in (canonicalization.note or "").lower()
          PATCH
          sed -i 's/^          //' /tmp/pr31-fix.patch
          git apply --check /tmp/pr31-fix.patch
          git apply /tmp/pr31-fix.patch

      - name: Run focused collector regressions
        run: |
          python -m py_compile app/processing/s0_baseline.py tests/test_s0_phase2_baseline_mapping.py
          python -m pytest -q tests/test_s0_phase2_baseline_mapping.py

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "atlas-pr31-helper"
          git config user.email "atlas-pr31-helper@users.noreply.github.com"
          git add app/processing/s0_baseline.py tests/test_s0_phase2_baseline_mapping.py
          git diff --cached --check
          git commit -m "Fail closed on unreadable Phase 2 events"
          git push origin HEAD:s0/phase2-collector-mapping
