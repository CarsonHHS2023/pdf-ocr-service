name: Legacy Local OCR Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-local-ocr-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-local-ocr:
    name: Manual heavyweight local OCR tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install full local OCR dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run legacy heavyweight tests
        run: python -m pytest -q tests/test_heavy.py tests/test_phase2_integration.py
