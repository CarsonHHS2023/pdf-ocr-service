name: Provider 20 MiB Staging CI

on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-20mib:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-test.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r requirements-test.txt

      - name: Apply production-equivalent overlays
        run: |
          python scripts/apply_durable_ingestion_dispatch.py
          python scripts/apply_opencv_v4_modal_bridge.py
          python scripts/apply_crop_llm_background_cleanup.py
          python scripts/apply_provider_result_diagnostics.py
          python scripts/apply_presentation_provenance_fix.py
          python scripts/apply_heading_review_semantic_retry.py
          python scripts/apply_page_role_scope_alignment.py
          python scripts/apply_high_resolution_page_confirmation.py
          python scripts/apply_native_pdf_text_recovery.py
          python scripts/apply_s0_bounded_memory_compat.py
          python scripts/apply_s0_bounded_v4_output.py
          python scripts/apply_provider_transport_sharding.py
          python scripts/apply_s0_pdf_resource_heartbeat.py
          python scripts/apply_provider_runtime_preflight.py
          python scripts/apply_s0_v5_phase0_observability.py
          python scripts/apply_s0_visual_asset_generation_observability.py

      - name: Verify exact runtime markers
        run: |
          set -euo pipefail
          python -m py_compile \
            app/processing/pdf_provider_sharding.py \
            app/processing/pdf_provider_sharding_compat.py \
            app/processing/pdf_page_presentation_preprocess_compat.py \
            app/processing/pdf_page_classification_observability_compat.py \
            app/processing/pdf_ingestion.py \
            app/s0_visual_asset_generation_metrics.py \
            app/s0_visual_asset_generation_observability.py \
            scripts/apply_s0_visual_asset_generation_observability.py \
            scripts/apply_provider_20mib_observability_v2.py \
            scripts/apply_provider_20mib_observability_v3.py \
            scripts/apply_provider_20mib_observability_v4.py \
            scripts/apply_provider_20mib_observability_v5.py \
            scripts/apply_provider_20mib_review_fixes.py \
            scripts/apply_staging_classification_summary_highres_fix.py \
            tests/test_provider_shard_execution_contract.py \
            tests/test_provider_20mib_review_fixes.py \
            tests/test_provider_sharding_source_access.py \
            tests/test_classification_summary_highres_observability.py
          grep -q 'PROVIDER_TRANSPORT_SHARD_TARGET_BYTES = 20 \* _MIB' app/processing/pdf_provider_sharding.py
          grep -q 'PROVIDER_TRANSPORT_SHARD_MAX_BYTES = 20 \* _MIB' app/processing/pdf_provider_sharding.py
          grep -q 'PROVIDER_TRANSPORT_SHARD_EXECUTION_MODE = "sequential"' app/processing/pdf_provider_sharding.py
          ! grep -q 'PROVIDER_TRANSPORT_SHARD_MAX_CONCURRENCY' app/processing/pdf_provider_sharding.py
          ! grep -q 'asyncio.Semaphore' app/processing/pdf_provider_sharding.py
          ! grep -q 'asyncio.create_task' app/processing/pdf_provider_sharding.py
          ! grep -q 'asyncio.gather' app/processing/pdf_provider_sharding.py
          grep -q 'for plan in plans:' app/processing/pdf_provider_sharding.py
          grep -q 'shard_execution_mode=PROVIDER_TRANSPORT_SHARD_EXECUTION_MODE' app/processing/pdf_provider_sharding.py
          grep -q 'PDF_PROVIDER_SHARD_BATCH_TERMINAL' app/processing/pdf_provider_sharding.py
          grep -q 'PDF_PROVIDER_SHARD_CANCELLED' app/processing/pdf_provider_sharding.py
          grep -q 'PDF_PROVIDER_SHARD_CANONICALIZATION_FAILED' app/processing/pdf_provider_sharding.py
          grep -q 'None, merged, exc' app/processing/pdf_provider_sharding.py
          grep -q 'shard_delivery = integration.provider_delivery_descriptor(shard_input)' app/processing/pdf_provider_sharding.py
          grep -q 'source_transport_url_factory=shard_source_url_factory' app/processing/pdf_provider_sharding.py
          grep -q 'PDF_PAGE_CLASSIFICATION_SUMMARY' app/processing/pdf_page_classification_observability_compat.py
          grep -q 'classifier_fail_open_to_ocr_count' app/processing/pdf_page_classification_observability_compat.py
          grep -q 'presentation_page_high_resolution_confirmed' app/processing/pdf_page_classification_observability_compat.py
          grep -q 'timeout_config_valid=timeout_config_valid' app/processing/pdf_page_classification_observability_compat.py
          grep -q 'processing_attempt_id=_PROCESSING_ATTEMPT_ID.get()' app/processing/pdf_page_classification_observability_compat.py
          grep -q 'def page_classification_observation_context' app/processing/pdf_page_classification_observability_compat.py
          grep -q 'page_classification_observation_context,' app/processing/pdf_ingestion.py
          grep -q 'with page_classification_observation_context(processing_attempt_id):' app/processing/pdf_ingestion.py
          grep -q 'native_text_page_count' app/processing/pdf_provider_sharding_compat.py
          grep -q 'native_text_page_count' app/processing/pdf_page_presentation_preprocess_compat.py
          grep -q 'excluded_from_provider_count = local_result_count' app/processing/pdf_page_presentation_preprocess_compat.py
          grep -q 'provider_excluded_page_count' app/processing/pdf_page_presentation_preprocess_compat.py
          grep -q 'install_page_classification_observability_compat()' app/processing/pdf_ingestion.py
          grep -q 'install_visual_asset_generation_observability()' app/processing/pdf_ingestion.py
          grep -q '_measure_visual_asset_generation(' app/processing/s0_baseline.py
          git diff --check

      - name: Run focused provider and classification regressions
        run: |
          python -m pytest -q \
            tests/test_pdf_provider_sharding.py \
            tests/test_pdf_provider_sharding_compat.py \
            tests/test_provider_timeout_observability.py \
            tests/test_provider_20mib_observability.py \
            tests/test_provider_20mib_review_fixes.py \
            tests/test_provider_shard_execution_contract.py \
            tests/test_provider_sharding_source_access.py \
            tests/test_classification_summary_highres_observability.py \
            tests/test_high_resolution_page_confirmation.py \
            tests/test_native_pdf_text_recovery.py
          python -m pytest -q \
            tests/test_s0_visual_asset_generation_observability.py \
            tests/test_s0_visual_asset_generation_composed.py
