name: S0 Baseline CI

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'app/models.py'
      - 'app/processing/processing_event_model.py'
      - 'app/processing/processing_events.py'
      - 'app/processing/s0_baseline.py'
      - 'app/processing/s0_pdf_resource_heartbeat.py'
      - 'app/processing/s0_phase2_stage_observability.py'
      - 'scripts/apply_s0_v5_phase0_observability.py'
      - 'scripts/report_s0_baseline.py'
      - 'tests/test_s0_baseline.py'
      - 'tests/test_s0_terminal_status.py'
      - 'tests/test_s0_payload_decode_status.py'
      - 'tests/test_s0_retryable_checksum_status.py'
      - 'tests/test_s0_operator_run_record.py'
      - 'tests/test_s0_markdown_notes.py'
      - 'tests/test_s0_phase2_stage_observability.py'
      - 'tests/test_s0_phase2_baseline_mapping.py'
      - 'docs/testing/s0-benchmark-fixtures-v1.md'
      - 'docs/reviews/s0-baseline-2026-08-23.md'
      - '.github/workflows/s0-baseline-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-uninspectable-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 's0/phase2-collector-mapping'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: s0/phase2-collector-mapping
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -q pytest sqlalchemy alembic

      - name: Apply exact reviewed fix idempotently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          collector = Path('app/processing/s0_baseline.py')
          text = collector.read_text()
          if 'uninspectable_event_names: frozenset[str] = frozenset(),' not in text:
              old = '''    evidence_incomplete: bool,\n    require_process_wide: bool = False,\n) -> _EventMeasurement:\n    """Extract one unambiguous successful numeric measurement by exact event contract."""\n    matching = [event for event in decoded_events if event.event_name == event_name]\n'''
              new = '''    evidence_incomplete: bool,\n    uninspectable_event_names: frozenset[str] = frozenset(),\n    require_process_wide: bool = False,\n) -> _EventMeasurement:\n    """Extract one unambiguous successful numeric measurement by exact event contract."""\n    if event_name in uninspectable_event_names:\n        return _EventMeasurement(\n            value=None,\n            status="not_available",\n            note=(\n                f"At least one retained {event_name} payload could not be inspected; "\n                "the collector cannot rule out an ambiguous duplicate successful measurement."\n            ),\n        )\n\n    matching = [event for event in decoded_events if event.event_name == event_name]\n'''
              assert text.count(old) == 1
              text = text.replace(old, new)

              old = '''    decoded_events: list[_DecodedEvent] = []\n    event_payload_decode_incomplete = False\n    event_payload_oversized_incomplete = False\n    for row in rows:\n        if row.payload_oversized:\n            event_payload_oversized_incomplete = True\n            continue\n        payload, decode_valid = _decode_event_payload(row.payload_json)\n        if not decode_valid:\n            event_payload_decode_incomplete = True\n            continue\n        decoded_events.append(_DecodedEvent(event_name=row.event_name, payload=payload))\n    decoded_events_tuple = tuple(decoded_events)\n'''
              new = '''    decoded_events: list[_DecodedEvent] = []\n    uninspectable_event_names: set[str] = set()\n    event_payload_decode_incomplete = False\n    event_payload_oversized_incomplete = False\n    for row in rows:\n        if row.payload_oversized:\n            event_payload_oversized_incomplete = True\n            uninspectable_event_names.add(row.event_name)\n            continue\n        payload, decode_valid = _decode_event_payload(row.payload_json)\n        if not decode_valid:\n            event_payload_decode_incomplete = True\n            uninspectable_event_names.add(row.event_name)\n            continue\n        decoded_events.append(_DecodedEvent(event_name=row.event_name, payload=payload))\n    decoded_events_tuple = tuple(decoded_events)\n    uninspectable_event_names_frozen = frozenset(uninspectable_event_names)\n'''
              assert text.count(old) == 1
              text = text.replace(old, new)

              calls = [
                  ('PDF_S0_PREPROCESSING_MEASURED', 'elapsed_seconds'),
                  ('PDF_S0_CANONICALIZATION_MEASURED', 'elapsed_seconds'),
                  ('PDF_S0_PREPROCESSING_MEASURED', 'process_cpu_delta_seconds'),
                  ('PDF_S0_PREPROCESSING_MEASURED', 'process_rss_endpoint_mb'),
                  ('PDF_S0_PROVIDER_INTEGRATION_MEASURED', 'elapsed_seconds'),
                  ('PDF_S0_PREPROCESSING_MEASURED', 'provider_input_size_bytes'),
                  ('PDF_S0_CANONICALIZATION_MEASURED', 'raw_result_size_bytes'),
              ]
              for event_name, field in calls:
                  needle = f'''        event_name="{event_name}",\n        field="{field}",\n        evidence_incomplete=payload_evidence_incomplete,\n'''
                  replacement = needle + '        uninspectable_event_names=uninspectable_event_names_frozen,\n'
                  assert text.count(needle) == 1, (event_name, field, text.count(needle))
                  text = text.replace(needle, replacement)
              collector.write_text(text)

          tests = Path('tests/test_s0_phase2_baseline_mapping.py')
          test_text = tests.read_text()
          if 'from app.processing.processing_events import MAX_EVENT_PAYLOAD_BYTES' not in test_text:
              needle = 'from app.processing.processing_event_model import ProcessingEvent\n'
              assert test_text.count(needle) == 1
              test_text = test_text.replace(
                  needle,
                  needle + 'from app.processing.processing_events import MAX_EVENT_PAYLOAD_BYTES\n',
              )
          if 'def test_malformed_same_name_event_blocks_definitive_preprocessing_measurement' not in test_text:
              test_text += '''\n\ndef test_malformed_same_name_event_blocks_definitive_preprocessing_measurement() -> None:\n    db = _session()\n    run_id = _seed_phase2_run(db)\n    started = datetime(2026, 8, 24, 22, 47, 28)\n    db.add(\n        ProcessingEvent(\n            id="phase2-preprocessing-malformed",\n            processing_run_id=run_id,\n            document_id="doc-phase2-map",\n            schema_version="atlas.processing.event.v1",\n            event_name="PDF_S0_PREPROCESSING_MEASURED",\n            severity="info",\n            payload_json="{malformed-json",\n            created_at=started + timedelta(seconds=46),\n        )\n    )\n    db.commit()\n\n    snapshot = collect_s0_run_snapshot(db, processing_run_id=run_id)\n\n    assert snapshot.event_payload_decode_incomplete is True\n    preprocessing_wall = _metric(snapshot, "preprocessing_wall_seconds")\n    assert preprocessing_wall.status == "not_available"\n    assert preprocessing_wall.value is None\n    assert "could not be inspected" in (preprocessing_wall.note or "").lower()\n\n\ndef test_oversized_same_name_event_blocks_definitive_canonicalization_measurement() -> None:\n    db = _session()\n    run_id = _seed_phase2_run(db)\n    started = datetime(2026, 8, 24, 22, 47, 28)\n    db.add(\n        ProcessingEvent(\n            id="phase2-canonicalization-oversized",\n            processing_run_id=run_id,\n            document_id="doc-phase2-map",\n            schema_version="atlas.processing.event.v1",\n            event_name="PDF_S0_CANONICALIZATION_MEASURED",\n            severity="info",\n            payload_json="x" * (MAX_EVENT_PAYLOAD_BYTES + 1),\n            created_at=started + timedelta(seconds=152, microseconds=1),\n        )\n    )\n    db.commit()\n\n    snapshot = collect_s0_run_snapshot(db, processing_run_id=run_id)\n\n    assert snapshot.event_payload_oversized_incomplete is True\n    canonicalization = _metric(snapshot, "canonicalization_duration_seconds")\n    assert canonicalization.status == "not_available"\n    assert canonicalization.value is None\n    assert "could not be inspected" in (canonicalization.note or "").lower()\n'''
              tests.write_text(test_text)
          PY

      - name: Run focused collector regressions
        run: |
          python -m py_compile app/processing/s0_baseline.py tests/test_s0_phase2_baseline_mapping.py
          python -m pytest -q tests/test_s0_phase2_baseline_mapping.py

      - name: Commit exact fix if needed
        shell: bash
        run: |
          if git diff --quiet -- app/processing/s0_baseline.py tests/test_s0_phase2_baseline_mapping.py; then
            echo "Exact fix already present; nothing to push."
            exit 0
          fi
          git config user.name "atlas-pr31-helper"
          git config user.email "atlas-pr31-helper@users.noreply.github.com"
          git add app/processing/s0_baseline.py tests/test_s0_phase2_baseline_mapping.py
          git diff --cached --check
          git commit -m "Fail closed on unreadable Phase 2 events"
          git push origin HEAD:s0/phase2-collector-mapping

  baseline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -q pytest sqlalchemy alembic

      - name: Static syntax check
        run: |
          python -m py_compile \
            app/processing/s0_baseline.py \
            app/processing/s0_phase2_stage_observability.py \
            scripts/apply_s0_v5_phase0_observability.py \
            scripts/report_s0_baseline.py \
            tests/test_s0_baseline.py \
            tests/test_s0_terminal_status.py \
            tests/test_s0_payload_decode_status.py \
            tests/test_s0_retryable_checksum_status.py \
            tests/test_s0_operator_run_record.py \
            tests/test_s0_markdown_notes.py \
            tests/test_s0_phase2_stage_observability.py \
            tests/test_s0_phase2_baseline_mapping.py

      - name: Run S0 baseline contract tests
        run: |
          python -m pytest -q \
            tests/test_s0_baseline.py \
            tests/test_s0_terminal_status.py \
            tests/test_s0_payload_decode_status.py \
            tests/test_s0_retryable_checksum_status.py \
            tests/test_s0_operator_run_record.py \
            tests/test_s0_markdown_notes.py \
            tests/test_s0_phase2_stage_observability.py \
            tests/test_s0_phase2_baseline_mapping.py

      - name: Verify operator CLI
        run: python scripts/report_s0_baseline.py --help >/dev/null

      - name: Lock privacy-safe S0 documentation
        run: |
          grep -q 'S0 remains In Progress' docs/reviews/s0-baseline-2026-08-23.md
          grep -q -- '--fixture-registry-version' docs/reviews/s0-baseline-2026-08-23.md
          grep -q 'Do not commit filenames, titles, text excerpts' docs/testing/s0-benchmark-fixtures-v1.md
          ! grep -q 'private.pdf' docs/reviews/s0-baseline-2026-08-23.md
