name: S0 Baseline CI

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'app/access_middleware.py'
      - 'app/models.py'
      - 'app/s0_object_store_io_observability.py'
      - 'app/s0_provider_source_download_observability.py'
      - 'app/s0_reader_open_observability.py'
      - 'app/s0_reader_open_metrics.py'
      - 'app/s0_provider_compute_observability.py'
      - 'app/s0_provider_staging_routing.py'
      - 'app/s0_transport_download_observability.py'
      - 'app/s0_transport_scope_terminal_observability.py'
      - 'app/s0_upload_boundary_observability.py'
      - 'app/s0_upload_durable_dispatch_compat.py'
      - 'app/processing/integration.py'
      - 'app/processing/orchestration.py'
      - 'app/processing/processing_event_model.py'
      - 'app/processing/processing_events.py'
      - 'app/processing/s0_baseline.py'
      - 'app/processing/s0_pdf_resource_heartbeat.py'
      - 'app/processing/s0_phase2_stage_observability.py'
      - 'app/processing/transport/service.py'
      - 'app/routers/source_transport.py'
      - 'scripts/apply_s0_object_store_io_observability.py'
      - 'scripts/apply_s0_provider_source_download_observability.py'
      - 'scripts/apply_s0_provider_compute_observability.py'
      - 'scripts/apply_s0_reader_open_observability.py'
      - 'scripts/apply_s0_provider_staging_routing.py'
      - 'scripts/apply_s0_transport_download_observability.py'
      - 'scripts/apply_s0_transport_terminal_collector.py'
      - 'scripts/apply_s0_upload_baseline_mapping.py'
      - 'scripts/apply_s0_v5_phase0_observability.py'
      - 'scripts/report_s0_baseline.py'
      - 'tests/test_s0_baseline.py'
      - 'tests/test_s0_terminal_status.py'
      - 'tests/test_s0_payload_decode_status.py'
      - 'tests/test_s0_retryable_checksum_status.py'
      - 'tests/test_s0_operator_run_record.py'
      - 'tests/test_s0_markdown_notes.py'
      - 'tests/test_s0_object_store_io_observability.py'
      - 'tests/test_s0_phase2_stage_observability.py'
      - 'tests/test_s0_phase2_baseline_mapping.py'
      - 'tests/test_s0_provider_source_download_observability.py'
      - 'tests/test_s0_reader_open_observability.py'
      - 'tests/test_s0_provider_compute_observability.py'
      - 'tests/test_s0_provider_staging_routing.py'
      - 'tests/test_s0_transport_atomic_ordinal.py'
      - 'tests/test_s0_transport_download_observability.py'
      - 'tests/test_s0_transport_sharding_decision_completeness.py'
      - 'tests/test_s0_upload_boundary_observability.py'
      - 'tests/test_s0_upload_durable_dispatch_compat.py'
      - 'docs/testing/s0-benchmark-fixtures-v1.md'
      - 'docs/reviews/s0-baseline-2026-08-23.md'
      - '.github/workflows/s0-baseline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check -q pytest sqlalchemy alembic fastapi==0.115.0 httpx==0.24.1

      - name: Apply canonical upload collector mapping
        run: |
          python scripts/apply_s0_upload_baseline_mapping.py
          python scripts/apply_s0_upload_baseline_mapping.py

      - name: Apply object-store I/O observability
        run: |
          python scripts/apply_s0_object_store_io_observability.py
          python scripts/apply_s0_transport_terminal_collector.py
          python scripts/apply_s0_object_store_io_observability.py
          python scripts/apply_s0_transport_terminal_collector.py

      - name: Apply S0.3.3 transport, Provider download, and Staging routing
        run: |
          python scripts/apply_s0_transport_download_observability.py
          python scripts/apply_s0_provider_source_download_observability.py
          python scripts/apply_s0_provider_compute_observability.py
          python scripts/apply_s0_reader_open_observability.py
          python scripts/apply_s0_provider_staging_routing.py
          python scripts/apply_s0_transport_download_observability.py
          python scripts/apply_s0_provider_source_download_observability.py
          python scripts/apply_s0_provider_compute_observability.py
          python scripts/apply_s0_reader_open_observability.py
          python scripts/apply_s0_provider_staging_routing.py

      - name: Static syntax check
        run: |
          python -m py_compile \
            app/s0_object_store_io_observability.py \
            app/s0_provider_source_download_observability.py \
            app/s0_reader_open_observability.py \
            app/s0_reader_open_metrics.py \
            app/s0_provider_compute_observability.py \
            app/s0_provider_staging_routing.py \
            app/s0_transport_download_observability.py \
            app/s0_transport_scope_terminal_observability.py \
            app/s0_upload_boundary_observability.py \
            app/s0_upload_durable_dispatch_compat.py \
            app/processing/integration.py \
            app/processing/orchestration.py \
            app/processing/pdf_ingestion.py \
            app/processing/s0_baseline.py \
            app/processing/s0_phase2_stage_observability.py \
            app/processing/transport/service.py \
            app/routers/source_transport.py \
            scripts/apply_s0_object_store_io_observability.py \
            scripts/apply_s0_provider_source_download_observability.py \
            scripts/apply_s0_provider_compute_observability.py \
            scripts/apply_s0_reader_open_observability.py \
            scripts/apply_s0_provider_staging_routing.py \
            scripts/apply_s0_transport_download_observability.py \
            scripts/apply_s0_transport_terminal_collector.py \
            scripts/apply_s0_upload_baseline_mapping.py \
            scripts/apply_s0_v5_phase0_observability.py \
            scripts/report_s0_baseline.py \
            tests/test_s0_baseline.py \
            tests/test_s0_terminal_status.py \
            tests/test_s0_payload_decode_status.py \
            tests/test_s0_retryable_checksum_status.py \
            tests/test_s0_operator_run_record.py \
            tests/test_s0_markdown_notes.py \
            tests/test_s0_object_store_io_observability.py \
            tests/test_s0_phase2_stage_observability.py \
            tests/test_s0_phase2_baseline_mapping.py \
            tests/test_s0_provider_source_download_observability.py \
            tests/test_s0_reader_open_observability.py \
            tests/test_s0_provider_compute_observability.py \
            tests/test_s0_provider_staging_routing.py \
            tests/test_s0_transport_atomic_ordinal.py \
            tests/test_s0_transport_download_observability.py \
            tests/test_s0_transport_sharding_decision_completeness.py \
            tests/test_s0_upload_boundary_observability.py \
            tests/test_s0_upload_durable_dispatch_compat.py

      - name: Run S0 baseline contract tests
        run: |
          python -m pytest -q \
            tests/test_s0_baseline.py \
            tests/test_s0_terminal_status.py \
            tests/test_s0_payload_decode_status.py \
            tests/test_s0_retryable_checksum_status.py \
            tests/test_s0_operator_run_record.py \
            tests/test_s0_markdown_notes.py \
            tests/test_s0_object_store_io_observability.py \
            tests/test_s0_phase2_stage_observability.py \
            tests/test_s0_phase2_baseline_mapping.py \
            tests/test_s0_provider_source_download_observability.py \
            tests/test_s0_reader_open_observability.py \
            tests/test_s0_provider_compute_observability.py \
            tests/test_s0_provider_staging_routing.py \
            tests/test_s0_transport_atomic_ordinal.py \
            tests/test_s0_transport_download_observability.py \
            tests/test_s0_transport_sharding_decision_completeness.py \
            tests/test_s0_upload_boundary_observability.py \
            tests/test_s0_upload_durable_dispatch_compat.py

      - name: Verify operator CLI
        run: python scripts/report_s0_baseline.py --help >/dev/null

      - name: Lock privacy-safe S0 documentation
        run: |
          grep -q 'S0 remains In Progress' docs/reviews/s0-baseline-2026-08-23.md
          grep -q -- '--fixture-registry-version' docs/reviews/s0-baseline-2026-08-23.md
          grep -q 'Do not commit filenames, titles, text excerpts' docs/testing/s0-benchmark-fixtures-v1.md
          ! grep -q 'private.pdf' docs/reviews/s0-baseline-2026-08-23.md
