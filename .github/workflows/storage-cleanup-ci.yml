name: HF Storage Cleanup Policy CI

on:
  pull_request:
    branches: [staging]
    paths:
      - 'scripts/cleanup_hf_buckets.py'
      - 'tests/test_hf_bucket_cleanup.py'
      - '.github/workflows/storage-cleanup.yml'
      - '.github/workflows/storage-cleanup-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cleanup test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            pytest \
            SQLAlchemy==2.0.28 \
            'huggingface-hub>=1.5.0,<2'

      - name: Verify Hugging Face missing-bucket exception contract
        run: python -c 'from huggingface_hub.errors import BucketNotFoundError; print(BucketNotFoundError.__name__)'

      - name: Verify cleanup policy is hard-locked to Staging
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/cleanup_hf_buckets.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/storage-cleanup.yml').read_text(encoding='utf-8')
          staging_bucket = 'carsonhhs/pdf-ocr-service-ocrmypdf-test-storage'
          production_bucket = 'carsonhhs/pdf-ocr-service-storage'

          assert f'DEFAULT_STAGING_BUCKET = "{staging_bucket}"' in script
          assert 'DEFAULT_STAGING_RETENTION_DAYS = 30' in script
          assert staging_bucket in workflow
          assert production_bucket not in script
          assert production_bucket not in workflow
          assert '--staging-bucket' not in script
          assert '--staging-bucket' not in workflow
          assert '--retention-days' not in script
          assert '--retention-days' not in workflow
          assert 'purge-test' not in script
          assert 'purge-test' not in workflow
          PY

      - name: Run cleanup policy regressions
        run: |
          python -m py_compile scripts/cleanup_hf_buckets.py tests/test_hf_bucket_cleanup.py
          python -m pytest -q tests/test_hf_bucket_cleanup.py
          git diff --check
