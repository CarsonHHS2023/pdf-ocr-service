name: Cleanup Staging HF Storage Bucket

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Actually delete files older than 30 days (false = dry run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hf-staging-storage-bucket-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      STAGING_BUCKET: carsonhhs/pdf-ocr-service-ocrmypdf-test-storage
      STAGING_RETENTION_DAYS: '30'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face bucket client
        run: python -m pip install --disable-pip-version-check -q 'huggingface-hub>=1.5.0,<2'

      - name: Validate cleanup credential
        run: test -n "$HF_TOKEN"

      - name: Run scheduled Staging retention cleanup
        if: github.event_name == 'schedule'
        run: |
          python scripts/cleanup_hf_buckets.py \
            --staging-bucket "$STAGING_BUCKET" \
            --retention-days "$STAGING_RETENTION_DAYS" \
            --apply

      - name: Run manual Staging cleanup
        if: github.event_name == 'workflow_dispatch'
        env:
          CLEANUP_APPLY: ${{ inputs.apply }}
        run: |
          args=(
            --staging-bucket "$STAGING_BUCKET"
            --retention-days "$STAGING_RETENTION_DAYS"
          )
          if [ "$CLEANUP_APPLY" = "true" ]; then
            args+=(--apply)
          fi
          python scripts/cleanup_hf_buckets.py "${args[@]}"

      - name: Record policy summary
        if: always()
        run: |
          {
            echo '### Staging HF Storage cleanup policy'
            echo ''
            echo '- Environment: **Staging only**.'
            echo '- Bucket: `carsonhhs/pdf-ocr-service-ocrmypdf-test-storage`.'
            echo '- Retention: delete files older than **30 days**.'
            echo '- Production bucket `carsonhhs/pdf-ocr-service-storage` is not targeted.'
            echo '- Manual runs default to dry-run unless **apply** is checked.'
            echo '- A private-bucket 404 is treated as an access/configuration failure, not silently skipped.'
          } >> "$GITHUB_STEP_SUMMARY"
