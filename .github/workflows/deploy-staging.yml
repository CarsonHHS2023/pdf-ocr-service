name: DEPRECATED - legacy main PR candidate staging deploy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Legacy input retained only so old bookmarks fail explicitly
        required: false
        type: string

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Reject deprecated deployment path
        run: |
          echo "::error::DEPRECATED: this workflow no longer writes the shared Staging runtime. Validate and promote through the authoritative staging branch pipeline instead."
          exit 1
