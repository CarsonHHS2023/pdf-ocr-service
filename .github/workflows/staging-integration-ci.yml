name: Staging Backend Integration CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlas_staging_ci
      ATLAS_POSTGRESQL_SCHEMA_TEST: '1'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_staging_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_staging_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-test.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r requirements-test.txt

      - name: Apply production-equivalent overlays
        run: |
          python scripts/apply_opencv_v4_modal_bridge.py
          python scripts/apply_crop_llm_background_cleanup.py
          python scripts/apply_provider_result_diagnostics.py
          python scripts/apply_presentation_provenance_fix.py
          python scripts/apply_heading_review_semantic_retry.py
          python scripts/apply_page_role_scope_alignment.py
          python scripts/apply_high_resolution_page_confirmation.py
          python scripts/apply_native_pdf_text_recovery.py
          python scripts/apply_s0_bounded_memory_compat.py
          python scripts/apply_s0_bounded_v4_output.py
          python scripts/apply_provider_transport_sharding.py
          python scripts/apply_s0_pdf_resource_heartbeat.py
          python scripts/apply_provider_runtime_preflight.py
          python scripts/apply_s0_v5_phase0_observability.py

      - name: Static and workflow checks
        run: |
          python -m compileall -q app alembic scripts
          grep -q 'install_s0_bounded_memory_compat' app/processing/pdf_ingestion.py
          grep -q 'install_s0_bounded_v4_output_compat' app/processing/pdf_ingestion.py
          grep -q 'install_provider_transport_sharding_compat' app/processing/pdf_ingestion.py
          grep -q 'install_opencv_page_heartbeat_probe' app/processing/pdf_ingestion.py
          grep -q 'await_with_pdf_processing_lease' app/processing/pdf_ingestion.py
          grep -q 'validate_provider_runtime_configuration(settings)' app/processing/pdf_ingestion.py
          grep -q 'install_s0_v5_phase1_shared_analysis' app/processing/pdf_ingestion.py
          grep -q 'install_s0_v5_phase0_observability' app/processing/pdf_ingestion.py
          grep -q 'recover_stale_s0_pdf_processing_runs' app/main.py
          grep -q 'resumable_upload.router' app/main.py
          grep -q 'direct_upload.router' app/main.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print(f'valid yaml: {path}')
          PY
          git diff --check

      - name: Upgrade fresh PostgreSQL database
        run: |
          alembic upgrade head
          alembic current
          python -m pytest -q tests/test_postgresql_readiness.py

      - name: Verify SQLite to PostgreSQL replay on empty target
        run: python -m pytest -q tests/test_postgresql_data_migration.py

      - name: Verify PostgreSQL relational integrity
        run: |
          python -m pytest -q \
            tests/test_postgresql_schema_integration.py \
            tests/test_postgresql_book_delete.py

      - name: Run production-equivalent staging contracts
        run: |
          python -m pytest -q \
            tests/test_source_transport_grants.py \
            tests/test_source_transport_endpoint.py \
            tests/test_end_to_end_processing_integration.py \
            tests/test_processing_orchestration.py \
            tests/test_ingestion_dispatch.py \
            tests/test_ingestion_acceptance.py \
            tests/test_paddle_vl_api_client.py \
            tests/test_paddle_vl_api_mapping.py \
            tests/test_production_pdf_modal_cutover.py \
            tests/test_pdf_geometry_preprocessing.py \
            tests/test_reader_contracts.py \
            tests/test_reader_validation_boundaries.py \
            tests/test_reader_service.py \
            tests/test_reader_api.py \
            tests/test_terminal_book_delete.py \
            tests/test_resumable_upload.py \
            tests/test_direct_object_upload.py \
            tests/test_direct_upload_page_count.py \
            tests/test_book_upload_admission.py \
            tests/test_book_processing_admission.py \
            tests/test_federated_storage_provider.py \
            tests/test_s3_storage_provider.py

      - name: Run provider sharding and S0 observability contracts
        run: |
          python -m pytest -q \
            tests/test_pdf_provider_sharding.py \
            tests/test_pdf_provider_sharding_compat.py \
            tests/test_s0_pdf_resource_heartbeat.py \
            tests/test_s0_presentation_memory_bounds.py \
            tests/test_s0_bounded_v4_output.py \
            tests/test_s0_benchmark_sampling.py \
            tests/test_s0_v5_shadow_planner.py \
            tests/test_s0_v5_phase0_observability.py \
            tests/test_s0_v5_phase1_shared_analysis.py \
            tests/test_provider_runtime_preflight.py \
            tests/test_s0_stale_processing_run_recovery.py \
            tests/test_staging_deployment_contract.py

      - name: Prepare exact tested staging artifact
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > staging-revision.txt
          test "$(cat staging-revision.txt)" = "$GITHUB_SHA"
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            -czf /tmp/atlas-staging-tested.tar.gz .
          sha256sum /tmp/atlas-staging-tested.tar.gz

      - name: Retain exact tested staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-staging-tested-${{ github.sha }}
          path: /tmp/atlas-staging-tested.tar.gz
          if-no-files-found: error
          retention-days: 3

  artifact_verification:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download exact tested staging artifact
        uses: actions/download-artifact@v4
        with:
          name: atlas-staging-tested-${{ github.sha }}
          path: /tmp/atlas-staging-artifact

      - name: Set up verification Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify artifact identity and deploy-critical modules
        run: |
          set -euo pipefail
          test -f /tmp/atlas-staging-artifact/atlas-staging-tested.tar.gz
          rm -rf /tmp/atlas-staging-verified
          mkdir -p /tmp/atlas-staging-verified
          tar -xzf /tmp/atlas-staging-artifact/atlas-staging-tested.tar.gz -C /tmp/atlas-staging-verified
          test "$(cat /tmp/atlas-staging-verified/staging-revision.txt)" = "$GITHUB_SHA"
          python -m py_compile \
            /tmp/atlas-staging-verified/app/main.py \
            /tmp/atlas-staging-verified/app/routers/health.py \
            /tmp/atlas-staging-verified/app/processing/ingestion_acceptance.py \
            /tmp/atlas-staging-verified/app/processing/ingestion_dispatch.py \
            /tmp/atlas-staging-verified/app/processing/ingestion_dispatch_model.py \
            /tmp/atlas-staging-verified/app/processing/pdf_ingestion.py \
            /tmp/atlas-staging-verified/app/processing/s0_provider_wait_lease.py \
            /tmp/atlas-staging-verified/app/processing/s0_v5_phase1_shared_analysis_compat.py \
            /tmp/atlas-staging-verified/app/processing/s0_v5_phase1_shared_cache.py \
            /tmp/atlas-staging-verified/app/processing/s0_v5_phase1_shared_v4.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: artifact_verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact tested staging head for remote guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify tested commit is still remote staging head
        run: |
          set -euo pipefail
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/staging | awk '{print $1}')"
          if [[ "$local_sha" != "$GITHUB_SHA" || "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale staging deploy: event=${GITHUB_SHA} local=${local_sha} remote=${remote_sha}" >&2
            exit 1
          fi

      - name: Download verified staging artifact
        uses: actions/download-artifact@v4
        with:
          name: atlas-staging-tested-${{ github.sha }}
          path: /tmp/atlas-staging-artifact

      - name: Unpack verified staging artifact
        run: |
          set -euo pipefail
          test -f /tmp/atlas-staging-artifact/atlas-staging-tested.tar.gz
          rm -rf /tmp/atlas-staging-deploy
          mkdir -p /tmp/atlas-staging-deploy
          tar -xzf /tmp/atlas-staging-artifact/atlas-staging-tested.tar.gz -C /tmp/atlas-staging-deploy
          test "$(cat /tmp/atlas-staging-deploy/staging-revision.txt)" = "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check -q huggingface-hub

      - name: Recheck remote staging head immediately before upload
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/staging | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Upload tested artifact and verify exact HF runtime revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STAGING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          from huggingface_hub import HfApi

          token = os.environ['HF_TOKEN']
          sha = os.environ['STAGING_SHA']
          repo_id = 'carsonhhs/pdf-ocr-service-staging'
          health_url = 'https://carsonhhs-pdf-ocr-service-staging.hf.space/api/v1/health'
          api = HfApi(token=token)
          intermediate_stages = {
              'BUILDING',
              'RUNNING_BUILDING',
              'APP_STARTING',
              'RUNNING_APP_STARTING',
          }

          def describe(label, runtime):
              print(
                  f'{label}: stage={runtime.stage} '
                  f'hardware={runtime.hardware} '
                  f'requested_hardware={runtime.requested_hardware}'
              )

          def dump_log_tail():
              for build in (False, True):
                  kind = 'build' if build else 'run'
                  try:
                      lines = [
                          str(line).rstrip('\n')[:2000]
                          for line in api.fetch_space_logs(
                              repo_id,
                              build=build,
                              follow=False,
                          )
                      ]
                  except Exception as exc:
                      print(f'Unable to fetch HF {kind} logs: {exc!r}')
                      continue
                  print(f'--- HF {kind} log tail ({min(len(lines), 120)} lines) ---')
                  for line in lines[-120:]:
                      print(line)

          before = api.get_space_runtime(repo_id)
          describe('HF runtime before upload', before)

          print(f'Uploading tested staging artifact for exact head {sha} to {repo_id}...')
          info = api.upload_folder(
              folder_path='/tmp/atlas-staging-deploy',
              repo_id=repo_id,
              repo_type='space',
              commit_message=f'Deploy tested staging {sha}',
          )
          print(info)

          after_upload = api.get_space_runtime(repo_id)
          describe('HF runtime after upload', after_upload)
          if after_upload.stage not in intermediate_stages:
              print(
                  'No active HF build/start transition observed after upload; '
                  f'forcing a restart from the latest Space revision (stage={after_upload.stage}).'
              )
              restarted = api.restart_space(repo_id)
              describe('HF runtime after restart request', restarted)

          try:
              final = api.wait_for_space(repo_id, timeout=600, poll_interval=5)
          except TimeoutError:
              print('Timed out waiting for HF staging Space to reach a terminal runtime stage.')
              dump_log_tail()
              raise

          describe('HF runtime final', final)
          if final.stage != 'RUNNING':
              dump_log_tail()
              raise RuntimeError(
                  f'HF staging Space did not become RUNNING; final stage={final.stage}'
              )

          deadline = time.monotonic() + 90
          last_health_error = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(health_url, timeout=10) as response:
                      payload = json.loads(response.read(4096).decode('utf-8'))
                      if (
                          response.status == 200
                          and payload.get('status') == 'healthy'
                          and payload.get('service') == 'pdf-ocr-service'
                          and payload.get('revision') == sha
                      ):
                          print(
                              f'HF staging exact runtime revision verified: {sha} '
                              f'at {health_url}'
                          )
                          break
                      last_health_error = RuntimeError(
                          f'unexpected health/revision response: '
                          f'status={response.status} payload={payload!r} expected_revision={sha}'
                      )
              except Exception as exc:
                  last_health_error = exc
              print(f'HF staging exact revision is not ready yet: {last_health_error!r}')
              time.sleep(5)
          else:
              dump_log_tail()
              raise RuntimeError(
                  f'HF staging runtime is RUNNING but exact revision verification failed: '
                  f'{last_health_error!r}'
              )
          PY

      - name: Verify staging head remained current after deployment
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/staging | awk '{print $1}')"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "Staging advanced during deployment; this run is not authoritative: event=${GITHUB_SHA} remote=${remote_sha}" >&2
            exit 1
          fi
          echo "HF Staging is running exact tested revision $GITHUB_SHA"
